<head>
  <meta charset="UTF-8" />

  <style>
    /* This tiny critical layer paints before Vite's CSS and React are available. */
    #mykliq-startup {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      box-sizing: border-box;
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      overflow: hidden;
      align-items: center;
      justify-content: center;
      color: #f8edf3;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(255, 27, 141, .12), transparent 47%),
        #09070b;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: opacity 180ms ease, visibility 180ms ease;
    }
    html.mykliq-mobile-startup #mykliq-startup { display: flex; }
    #mykliq-startup[data-state="ready"] {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .mk-splash-content {
      display: flex;
      width: min(100%, 360px);
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .mk-splash-mark {
      position: relative;
      display: grid;
      width: 96px;
      height: 96px;
      place-items: center;
      margin-bottom: 28px;
      border: 1px solid rgba(255, 27, 141, .32);
      border-radius: 30px;
      background: linear-gradient(145deg, rgba(255, 27, 141, .11), rgba(255, 255, 255, .025));
      box-shadow: 0 18px 60px rgba(255, 27, 141, .12), inset 0 1px rgba(255,255,255,.08);
    }
    .mk-splash-mark::before {
      position: absolute;
      inset: -8px;
      border: 1px solid rgba(255, 27, 141, .12);
      border-radius: 37px;
      content: "";
    }
    .mk-splash-mark img {
      width: 64px;
      height: 64px;
      object-fit: contain;
    }
    .mk-splash-name {
      margin: 0;
      color: #fff7fb;
      font-size: clamp(34px, 9vw, 42px);
      font-weight: 750;
      letter-spacing: -.065em;
      line-height: 1;
    }
    .mk-splash-name span { color: #ff1b8d; }
    .mk-splash-tagline {
      margin: 12px 0 0;
      color: #aa9da5;
      font-size: 13px;
      letter-spacing: .025em;
    }
    .mk-splash-loader {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 50px;
    }
    .mk-splash-loader i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ff1b8d;
      opacity: .35;
      animation: mk-splash-pulse 1.1s ease-in-out infinite;
    }
    .mk-splash-loader i:nth-child(2) { animation-delay: .16s; }
    .mk-splash-loader i:nth-child(3) { animation-delay: .32s; }
    .mk-splash-status {
      margin: 14px 0 0;
      color: #796f76;
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .mk-splash-recovery {
      display: none;
      margin-top: 20px;
      color: #b9adb5;
      font-size: 13px;
      line-height: 1.5;
    }
    #mykliq-startup[data-state="stalled"] .mk-splash-loader { display: none; }
    #mykliq-startup[data-state="stalled"] .mk-splash-recovery { display: block; }
    .mk-splash-retry {
      min-height: 44px;
      margin-top: 14px;
      padding: 0 20px;
      border: 1px solid rgba(255, 27, 141, .48);
      border-radius: 999px;
      background: rgba(255, 27, 141, .12);
      color: #ffd7e9;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
    }
    @keyframes mk-splash-pulse {
      0%, 100% { opacity: .28; transform: scale(.82); }
      50% { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      #mykliq-startup { transition: none; }
      .mk-splash-loader i { animation: none; opacity: .75; }
    }
  </style>
  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var isAppleTouchTablet = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
      var isMobileOrTablet = /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || isAppleTouchTablet;
      if (!isMobileOrTablet) return;

      document.documentElement.classList.add("mykliq-mobile-startup");
      window.setTimeout(function () {
        var splash = document.getElementById("mykliq-startup");
        if (!splash || splash.dataset.state === "ready") return;
        splash.dataset.state = "stalled";
      }, 15000);

      document.addEventListener("click", function (event) {
        var target = event.target;
        var retry = target && target.closest ? target.closest("[data-mykliq-startup-retry]") : null;
        if (!retry) return;
        window.location.reload();
      });
    })();
  </script>
