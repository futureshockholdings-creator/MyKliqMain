version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --force
    build:
      commands:
        - rm -rf dist
        - echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" >> .env
        - echo "VITE_VAPID_PUBLIC_KEY=$VITE_VAPID_PUBLIC_KEY" >> .env
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths: []
  redirects:
    - source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json|webp|webmanifest)$)([^.]+$)/>'
      target: /index.html
      status: '200'
  customHeaders:
    - pattern: '/sw.js'
      headers:
        - key: 'Service-Worker-Allowed'
          value: '/'
        - key: 'Cache-Control'
          value: 'no-cache'
        - key: 'Content-Type'
          value: 'application/javascript'
    - pattern: '/sw-ios.js'
      headers:
        - key: 'Service-Worker-Allowed'
          value: '/'
        - key: 'Cache-Control'
          value: 'no-cache'
        - key: 'Content-Type'
          value: 'application/javascript'
    - pattern: '/firebase-messaging-sw.js'
      headers:
        - key: 'Service-Worker-Allowed'
          value: '/'
        - key: 'Cache-Control'
          value: 'no-cache'
    - pattern: '/favicon*'
      headers:
        - key: 'Cache-Control'
          value: 'no-cache, no-store, must-revalidate'
    - pattern: '/apple-touch-icon.png'
      headers:
        - key: 'Cache-Control'
          value: 'no-cache, no-store, must-revalidate'
    - pattern: '/icons/*'
      headers:
        - key: 'Cache-Control'
          value: 'no-cache, no-store, must-revalidate'
